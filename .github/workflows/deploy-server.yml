name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'database/**'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ./server

      - name: Type check
        run: npm run type-check
        working-directory: ./server

      - name: Lint
        run: npm run lint
        working-directory: ./server

      - name: Build
        run: npm run build
        working-directory: ./server

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
        if: secrets.DOCKER_HUB_USERNAME != ''

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ secrets.DOCKER_HUB_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/easy-outbound-server:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/easy-outbound-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        if: secrets.DOCKER_HUB_USERNAME != ''

      - name: Build Docker image (no push)
        run: |
          docker build -t easy-outbound-server:latest ./server
        if: secrets.DOCKER_HUB_USERNAME == ''

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            # 进入项目目录
            cd ${{ secrets.DEPLOY_PATH || '/opt/easy-outbound-system' }}
            
            # 拉取最新代码
            git pull origin main
            
            # 拉取最新 Docker 镜像
            docker-compose pull server
            
            # 重启服务
            docker-compose up -d --no-deps server
            
            # 清理旧镜像
            docker image prune -f
            
            # 显示服务状态
            docker-compose ps

  notify:
    needs: [build-and-test, docker-build, deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.build-and-test.result }}" == "success" ] && \
             [ "${{ needs.docker-build.result }}" == "success" ] && \
             [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
            echo "Build and test: ${{ needs.build-and-test.result }}"
            echo "Docker build: ${{ needs.docker-build.result }}"
            echo "Deploy: ${{ needs.deploy.result }}"
            exit 1
          fi
